services:
  frontend:
    image: events-frontend
    build:
      context: ../events-frontend
      dockerfile: ../docker/events-frontend.Dockerfile
    restart: always
    ports:
      - '3000:3000'

  api:
    image: events-api
    build:
      context: ../events-api
      dockerfile: ../docker/events-api.Dockerfile
    restart: always
    ports:
      - '8080:8080'
    environment:
      MYSQL_HOST: db
    depends_on:
      - db

  db:
    image: mysql:9.6.0
    restart: always
    ports:
      - '3307:3307'
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: events
      MYSQL_TCP_PORT: 3307
    volumes:
      - mysql-data:/var/lib/mysql
volumes:
  mysql-data:

# Note: we are taking advantage of the Docker network that is automatically created so
# that these containers are able to communicate with each other.